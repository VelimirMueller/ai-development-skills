.t,.h{fill:#f1eef8}.s{fill:#b3adc6}.ln{stroke:#6f6888}.ar{fill:#6f6888}
.bad{fill:#3a2124;stroke:#7a3d42}.ok{fill:#1c3329;stroke:#3d7a5c}.bt{fill:#f08c8c}.ot{fill:#7fd6a8}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="720" height="222" rx="14"/><text class="h" x="24" y="34">How a person joins a newsletter</text><rect class="card" x="15.0" y="56" width="150" height="120" rx="12"/><text class="e" x="90.0" y="90" text-anchor="middle">📝</text><text class="t" x="90.0" y="114" text-anchor="middle">Form</text><text class="s" x="90.0" y="134" text-anchor="middle">person enters</text><text class="s" x="90.0" y="151" text-anchor="middle">an email</text><line class="ln" x1="167.0" y1="116.0" x2="193.0" y2="116.0" marker-end="url(#a)"/><rect class="card" x="195.0" y="56" width="150" height="120" rx="12"/><text class="e" x="270.0" y="90" text-anchor="middle">✉️</text><text class="t" x="270.0" y="114" text-anchor="middle">Confirm mail</text><text class="s" x="270.0" y="134" text-anchor="middle">double opt-in:</text><text class="s" x="270.0" y="151" text-anchor="middle">click to confirm</text><line class="ln" x1="347.0" y1="116.0" x2="373.0" y2="116.0" marker-end="url(#a)"/><rect class="card" x="375.0" y="56" width="150" height="120" rx="12"/><text class="e" x="450.0" y="90" text-anchor="middle">🗂️</text><text class="t" x="450.0" y="114" text-anchor="middle">List</text><text class="s" x="450.0" y="134" text-anchor="middle">contact lands</text><text class="s" x="450.0" y="151" text-anchor="middle">in the list</text><line class="ln" x1="527.0" y1="116.0" x2="553.0" y2="116.0" marker-end="url(#a)"/><rect class="card" x="555.0" y="56" width="150" height="120" rx="12"/><text class="e" x="630.0" y="90" text-anchor="middle">📣</text><text class="t" x="630.0" y="114" text-anchor="middle">Campaign</text><text class="s" x="630.0" y="134" text-anchor="middle">you send to</text><text class="s" x="630.0" y="151" text-anchor="middle">the list</text><text class="s" x="360.0" y="204" text-anchor="middle">No click on 