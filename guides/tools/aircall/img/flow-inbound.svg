<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" width="720" height="358" role="img" aria-label="How an incoming call travels"><title>How an incoming call travels</title><style>
.bg{fill:#ffffff}.card{fill:#f6f3fb;stroke:#d9d3e6}.hub{fill:#fbe9fd;stroke:#c64fd6}
.t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b29}
.s{font:13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#5c5870}
.h{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b29}
.e{font:26px system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif}
.ln{stroke:#a59fb8;stroke-width:2;fill:none}.ar{fill:#a59fb8}
.bad{fill:#fdeeee;stroke:#e3a5a5}.ok{fill:#eaf7f0;stroke:#9fd3b7}
.bt{font:700 14px system-ui,sans-serif;fill:#b23a3a}.ot{font:700 14px system-ui,sans-serif;fill:#1c7a52}
@media (prefers-color-scheme:dark){.bg{fill:#17151f}.card{fill:#221f2e;stroke:#3a3550}.hub{fill:#3a1f40;stroke:#c64fd6}
.t,.h{fill:#f1eef8}.s{fill:#b3adc6}.ln{stroke:#6f6888}.ar{fill:#6f6888}
.bad{fill:#3a2124;stroke:#7a3d42}.ok{fill:#1c3329;stroke:#3d7a5c}.bt{fill:#f08c8c}.ot{fill:#7fd6a8}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="720" height="358" rx="14"/><text class="h" x="24" y="34">How an incoming call travels</text><rect class="card" x="15.0" y="56" width="150" height="120" rx="12"/><text class="e" x="90.0" y="90" text-anchor="middle">📱</text><text class="t" x="90.0" y="114" text-anchor="middle">Customer</text><text class="s" x="90.0" y="134" text-anchor="middle">calls your</text><text class="s" x="90.0" y="151" text-anchor="middle">number</text><line class="ln" x1="167.0" y1="116.0" x2="193.0" y2="116.0" marker-end="url(#a)"/><rect class="card" x="195.0" y="56" width="150" height="120" rx="12"/><text class="e" x="270.0" y="90" text-anchor="middle">🔀</text><text class="t" x="270.0" y="114" text-anchor="middle">Call flow</text><text class="s" x="270.0" y="134" text-anchor="middle">open? which team?</text><text class="s" x="270.0" y="151" text-anchor="middle">&quot;press 1&quot;</text><line class="ln" x1="347.0" y1="116.0" x2="373.0" y2="116.0" marker-end="url(#a)"/><rect class="card" x="375.0" y="56" width="150" height="120" rx="12"/><text class="e" x="450.0" y="90" text-anchor="middle">👥</text><text class="t" x="450.0" y="114" text-anchor="middle">Team rings</text><text class="s" x="450.0" y="134" text-anchor="middle">first free</text><text class="s" x="450.0" y="151" text-anchor="middle">person answers</text><line class="ln" x1="527.0" y1="116.0" x2="553.0" y2="116.0" marker-end="url(#a)"/><rect class="card" x="555.0" y="56" width="150" height="120" rx="12"/><text class="e" x="630.0" y="90" text-anchor="middle">💻</text><text class="t" x="630.0" y="114" text-anchor="middle">Workspace</text><text class="s" x="630.0" y="134" text-anchor="middle">agent talks,</text><text class="s" x="630.0" y="151" text-anchor="middle">adds a note</text><path class="ln" d="M630.0 178 V194 H270.0 V212" marker-end="url(#a)"/><rect class="card" x="195.0" y="216" width="150" height="120" rx="12"/><text class="e" x="270.0" y="250" text-anchor="middle">🔔</text><text class="t" x="270.0" y="274" text-anchor="middle">call.ended</text><text class="s" x="270.0" y="294" text-anchor="middle">webhook, about</text><text class="s" x="270.0" y="311" text-anchor="middle">30 s later</text><line class="ln" x1="347.0" y1="276.0" x2="373.0" y2="276.0" marker-end="url(#a)"/><rect class="card" x="375.0" y="216" width="150" height="120" rx="12"/><text class="e" x="450.0" y="250" text-anchor="middle">🗂️</text><text class="t" x="450.0" y="274" text-anchor="middle">CRM / your app</text><text class="s" x="450.0" y="294" text-anchor="middle">stores the</text><text class="s" x="450.0" y="311" text-anchor="middle">call data</text></svg>
