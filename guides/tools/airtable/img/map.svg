<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402" role="img" aria-label="Airtable — the parts"><title>Airtable — the parts</title><style>
.bg{fill:#ffffff}.card{fill:#f6f3fb;stroke:#d9d3e6}.hub{fill:#fbe9fd;stroke:#c64fd6}
.t{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b29}
.s{font:13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#5c5870}
.h{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b29}
.e{font:26px system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif}
.ln{stroke:#a59fb8;stroke-width:2;fill:none}.ar{fill:#a59fb8}
.bad{fill:#fdeeee;stroke:#e3a5a5}.ok{fill:#eaf7f0;stroke:#9fd3b7}
.bt{font:700 14px system-ui,sans-serif;fill:#b23a3a}.ot{font:700 14px system-ui,sans-serif;fill:#1c7a52}
@media (prefers-color-scheme:dark){.bg{fill:#17151f}.card{fill:#221f2e;stroke:#3a3550}.hub{fill:#3a1f40;stroke:#c64fd6}
.t,.h{fill:#f1eef8}.s{fill:#b3adc6}.ln{stroke:#6f6888}.ar{fill:#6f6888}
.bad{fill:#3a2124;stroke:#7a3d42}.ok{fill:#1c3329;stroke:#3d7a5c}.bt{fill:#f08c8c}.ot{fill:#7fd6a8}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="720" height="402" rx="14"/><text class="h" x="24" y="34">Airtable — the parts</text><rect class="card" x="16.0" y="54" width="160" height="112" rx="12"/><text class="e" x="96.0" y="88" text-anchor="middle">📋</text><text class="t" x="96.0" y="112" text-anchor="middle">Tables</text><text class="s" x="96.0" y="132" text-anchor="middle">one kind of thing</text><text class="s" x="96.0" y="149" text-anchor="middle">(orders, people)</text><rect class="card" x="192.0" y="54" width="160" height="112" rx="12"/><text class="e" x="272.0" y="88" text-anchor="middle">🔤</text><text class="t" x="272.0" y="112" text-anchor="middle">Fields</text><text class="s" x="272.0" y="132" text-anchor="middle">columns with a</text><text class="s" x="272.0" y="149" text-anchor="middle">type (date, link)</text><rect class="card" x="368.0" y="54" width="160" height="112" rx="12"/><text class="e" x="448.0" y="88" text-anchor="middle">📄</text><text class="t" x="448.0" y="112" text-anchor="middle">Records</text><text class="s" x="448.0" y="132" text-anchor="middle">rows — one</text><text class="s" x="448.0" y="149" text-anchor="middle">real thing each</text><rect class="card" x="544.0" y="54" width="160" height="112" rx="12"/><text class="e" x="624.0" y="88" text-anchor="middle">🔗</text><text class="t" x="624.0" y="112" text-anchor="middle">Linked records</text><text class="s" x="624.0" y="132" text-anchor="middle">a field that points</text><text class="s" x="624.0" y="149" text-anchor="middle">to another table</text><rect class="card" x="16.0" y="266" width="160" height="112" rx="12"/><text class="e" x="96.0" y="300" text-anchor="middle">👓</text><text class="t" x="96.0" y="324" text-anchor="middle">Views</text><text class="s" x="96.0" y="344" text-anchor="middle">a saved filter</text><text class="s" x="96.0" y="361" text-anchor="middle">and sort</text><rect class="card" x="192.0" y="266" width="160" height="112" rx="12"/><text class="e" x="272.0" y="300" text-anchor="middle">🧩</text><text class="t" x="272.0" y="324" text-anchor="middle">Interfaces</text><text class="s" x="272.0" y="344" text-anchor="middle">simple screens</text><text class="s" x="272.0" y="361" text-anchor="middle">for people</text><rect class="card" x="368.0" y="266" width="160" height="112" rx="12"/><text class="e" x="448.0" y="300" text-anchor="middle">📝</text><text class="t" x="448.0" y="324" text-anchor="middle">Forms</text><text class="s" x="448.0" y="344" text-anchor="middle">let outsiders</text><text class="s" x="448.0" y="361" text-anchor="middle">add records</text><rect class="card" x="544.0" y="266" width="160" height="112" rx="12"/><text class="e" x="624.0" y="300" text-anchor="middle">⚡</text><text class="t" x="624.0" y="324" text-anchor="middle">Automations</text><text class="s" x="624.0" y="344" text-anchor="middle">trigger → actions</text><text class="s" x="624.0" y="361" text-anchor="middle">(mail, script)</text><line class="ln" x1="96.0" y1="166" x2="360.0" y2="206"/><line class="ln" x1="272.0" y1="166" x2="360.0" y2="206"/><line class="ln" x1="448.0" y1="166" x2="360.0" y2="206"/><line class="ln" x1="624.0" y1="166" x2="360.0" y2="206"/><line class="ln" x1="96.0" y1="266" x2="360.0" y2="246"/><line class="ln" x1="272.0" y1="266" x2="360.0" y2="246"/><line class="ln" x1="448.0" y1="266" x2="360.0" y2="246"/><line class="ln" x1="624.0" y1="266" x2="360.0" y2="246"/><rect class="hub" x="250.0" y="206" width="220" height="40" rx="20"/><text class="h" x="360.0" y="232" text-anchor="middle">🗃️ Base</text></svg>
