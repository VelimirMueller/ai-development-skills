name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by full SHA (a tag can be moved); Dependabot keeps it current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest ships bash 5 and jq, the validator's only requirements
      - run: bash scripts/validate.sh

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest ships shellcheck
      - name: bash -n and shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          [ "${#scripts[@]}" -eq 0 ] && exit 0
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck --severity=warning "${scripts[@]}"
